<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Iniciar Sesión - Facturación Pro</title>

                    "ios-green": "#34C759",
                    "on-secondary-fixed": "#002107",
                    "on-error-container": "#93000a",
                    "on-background": "#1a1b1f",
                    "surface-background": "#F2F2F7",
                    "error": "#ba1a1a",
                    "on-secondary": "#ffffff",
                    "surface-container-low": "#f4f3f8",
                    "charcoal-text": "#1C1C1E",
                    "secondary-fixed-dim": "#53e16f",
                    "tertiary": "#894d00",
                    "ios-blue": "#007AFF",
                    "on-secondary-container": "#00732a",
                    "inverse-surface": "#2f3034",
                    "on-primary-container": "#fefcff",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#c1c6d7",
                    "on-tertiary-container": "#fffbff",
                    "outline": "#717786",
                    "surface-container-highest": "#e3e2e7",
                    "tertiary-container": "#ac6300",
                    "surface": "#faf9fe",
                    "primary-fixed": "#d8e2ff",
                    "on-primary": "#ffffff",
                    "surface-tint": "#005bc1",
                    "surface-container": "#eeedf3",
                    "primary-container": "#0070eb",

<style>
        body {
            background-color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        input:focus {
            outline: none;
            border-color: #007AFF !important;
            box-shadow: 0 0 0 1px #007AFF;
        }
        .ios-blur {
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen p-margin-main overflow-hidden">
<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- Logo Area -->
<div class="mb-12 flex flex-col items-center text-center">
<div class="w-20 h-20 bg-primary-container rounded-2xl flex items-center justify-center mb-6 shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-charcoal-text mb-2">Bienvenido</h1>
<p class="font-body-md text-body-md text-ios-gray">Gestione su facturación profesional de forma sencilla</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-5" onsubmit="return false;">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="font-label-lg text-label-lg text-charcoal-text ml-1" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-ios-gray text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full h-touch-target-min pl-11 pr-4 bg-surface-container-low border border-outline-variant/30 rounded-xl font-body-lg text-body-lg text-charcoal-text transition-all duration-200" id="email" placeholder="nombre@empresa.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="font-label-lg text-label-lg text-charcoal-text" for="password">Contraseña</label>
<a class="font-label-lg text-label-lg text-ios-blue active:opacity-60 transition-opacity" href="#">¿Olvidó su clave?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-ios-gray text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full h-touch-target-min pl-11 pr-12 bg-surface-container-low border border-outline-variant/30 rounded-xl font-body-lg text-body-lg text-charcoal-text transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-ios-gray active:text-ios-blue transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-touch-target-min mt-4 bg-ios-blue text-white font-headline-md-mobile text-headline-md-mobile rounded-xl shadow-md active:scale-[0.98] active:brightness-95 transition-all duration-100 flex items-center justify-center gap-2" type="submit">
                Iniciar Sesión
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer / Social Login -->
<div class="mt-12 w-full">
<div class="flex items-center gap-4 mb-8">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="font-label-md text-label-md text-ios-gray">O CONTINUAR CON</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="h-touch-target-min flex items-center justify-center gap-2 border border-outline-variant/30 rounded-xl bg-white active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-charcoal-text" data-icon="fingerprint">fingerprint</span>
<span class="font-label-lg text-label-lg text-charcoal-text">Biometría</span>
</button>
<button class="h-touch-target-min flex items-center justify-center gap-2 border border-outline-variant/30 rounded-xl bg-white active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-charcoal-text" data-icon="key">key</span>
<span class="font-label-lg text-label-lg text-charcoal-text">Clave de Paso</span>
</button>
</div>
</div>
<p class="mt-12 font-body-md text-body-md text-ios-gray">
            ¿No tiene una cuenta? <a class="text-ios-blue font-label-lg" href="#">Contacte soporte</a>
</p>
</main>
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-40">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container/20 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-tertiary-container/10 blur-[120px]"></div>
</div>
<script>
        // Simple micro-interaction for password visibility
        const togglePass = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        const passIcon = togglePass.querySelector('.material-symbols-outlined');

        togglePass.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            passIcon.innerText = isPass ? 'visibility_off' : 'visibility';
        });

        // Add active state styles via JS for better control if needed, 
        // though Tailwind active: handles most of it.
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('touchstart', () => {}, {passive: true});
        });
    </script>
</body></html>
